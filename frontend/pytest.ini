[pytest]
# เก็บเทสต์เฉพาะใน tests/ เท่านั้น
#
# ถ้าไม่จำกัดไว้ pytest จะกวาด frontend/ ทั้งหมดแล้วเจอ `test_client.py`
# ซึ่งไม่ใช่ unittest แต่เป็นสคริปต์ manual ที่ยิง gRPC ตั้งแต่ตอน import
# (ต้องส่ง host/port ทาง argv) → collection error → ทั้งชุดถูก interrupt
# ไม่ได้รันสักเทสต์ ทั้งที่เทสต์จริงไม่มีอะไรพัง
testpaths = tests
