syntax = "proto3";

package swarmgod.v1;

option go_package = "github.com/swarmgod/backend/gen/swarmgod/v1;swarmgodv1";

// ═══════════════════════════════════════════════════════════
//  MISSION — run-based mission control
//  (Real-Flight Safety Fast-Track V2, phase F3 — docs/REAL_FLIGHT_SAFETY_FAST_TRACK_V2.md)
//
//  Core-owned run identity + Start/Cancel/Query with idempotency.
//  ฝั่ง Go ปัจจุบันเป็น SHADOW model (backend/internal/mission): คำนวณ state ได้
//  แต่ยังไม่ถือ flight authority — Python ยัง execute จริงจน F4 cutover.
//  ห้าม Mission Engine ยิง flight command เอง (ต้องผ่าน command.Service/safety).
// ═══════════════════════════════════════════════════════════

enum MissionMode {
  MISSION_MODE_GROUPED = 0;      // เส้นทางร่วม — advance เมื่อทุกลำถึง
  MISSION_MODE_SEPARATE = 1;     // เส้นทางรายลำ — advance อิสระ
  MISSION_MODE_SWARM_LEADER = 2; // Leader path — followers อยู่ใต้ swarm formation loop
}

enum MissionWpAction {
  MISSION_WP_ACTION_NONE = 0;
  MISSION_WP_ACTION_SERVO_A = 1;
  MISSION_WP_ACTION_SERVO_B = 2;
}

enum MissionRunState {
  MISSION_STATE_IDLE = 0;
  MISSION_STATE_VALIDATING = 1;
  MISSION_STATE_READY = 2;
  MISSION_STATE_RUNNING = 3;
  MISSION_STATE_WAITING = 4;
  MISSION_STATE_CANCELLING = 5;
  MISSION_STATE_CANCELLED = 6;
  MISSION_STATE_INTERRUPTED = 7;
  MISSION_STATE_FAILED = 8;
  MISSION_STATE_COMPLETED = 9;
}

// Normal post-mission ownership policy. This is deliberately distinct from
// failsafe/operator RTL and from the legacy compatibility bool.
enum MissionReturnPolicy {
  MISSION_RETURN_POLICY_UNSPECIFIED = 0;
  MISSION_RETURN_POLICY_NONE = 1;
  MISSION_RETURN_POLICY_RTL_ALL_AFTER_MISSION = 2;
  MISSION_RETURN_POLICY_SWARM_RETURN = 3;
  MISSION_RETURN_POLICY_WAVE_MANAGED_RETURN = 4;
}

enum MissionSeparateReturnTiming {
  MISSION_SEPARATE_RETURN_TIMING_UNSPECIFIED = 0;
  MISSION_SEPARATE_RETURN_ALL_ON_MISSION_COMPLETE = 1;
  // Reserved for a later return-corridor safety contract. Core rejects it.
  MISSION_SEPARATE_RETURN_EACH_ON_ROUTE_COMPLETE = 2;
}

enum MissionReturnState {
  MISSION_RETURN_STATE_INACTIVE = 0;
  MISSION_RETURN_STATE_PENDING = 1;
  MISSION_RETURN_STATE_RETURNING = 2;
  MISSION_RETURN_STATE_COMPLETED = 3;
  MISSION_RETURN_STATE_SUPPRESSED = 4;
  MISSION_RETURN_STATE_FAILED = 5;
  MISSION_RETURN_STATE_RECOVERY_REQUIRED = 6;
}

message MissionWaypoint {
  int32 seq = 1;
  double lat = 2;
  double lon = 3;
  double alt = 4;
  int32 wait_seconds = 5;         // 0..600 (HOLD/WAIT metadata, แยกจาก action)
  MissionWpAction action = 6;
}

message MissionRoute {
  uint32 drone_id = 1;            // 0 = shared route (GROUPED / SWARM_LEADER)
  repeated MissionWaypoint points = 2;
}

message MissionPlan {
  string plan_id = 1;             // immutable plan identity (client-generated)
  MissionMode mode = 2;
  repeated uint32 participants = 3;
  repeated MissionRoute routes = 4;
  uint32 leader_id = 5;           // SWARM_LEADER only
  double arrival_radius_m = 6;    // 0 = default 3.0m (ย้ายจาก map.html TGT_REACH_M)
  bool rtl_after = 7;
  map<uint32, double> participant_altitudes = 8; // frozen per-drone mission altitude (GROUPED compatibility)
  MissionReturnPolicy return_policy = 9; // UNSPECIFIED maps rtl_after compatibly
  MissionSeparateReturnTiming separate_return_timing = 10;
}

message StartMissionRequest {
  MissionPlan plan = 1;
  string operation_id = 2;        // idempotency key ของ Start (retry/double-click/reconnect)
}

message StartMissionResponse {
  bool ok = 1;
  string message = 2;
  uint64 run_id = 3;              // Core-generated run identity
  MissionRunState state = 4;
  bool authority_active = 5;      // true only when this run's GOTO owner is Go Core
}

message CancelMissionRequest {
  uint64 run_id = 1;              // ต้องตรงกับ active run; ไม่ตรง = no-op (stale-safe)
  string request_id = 2;
}

message GetMissionStateRequest {} // single active mission ต่อ Core (V2 scope)

message MissionWait {
  uint32 scope = 1;               // 0 = grouped; อื่น = drone id (SEPARATE)
  int32 index = 2;
  double remaining_s = 3;
  int32 total_s = 4;
}

message MissionParticipantRejection {
  uint64 run_id = 1;
  int32 waypoint_index = 2;
  uint32 drone_id = 3;
  string reason = 4;
}

message MissionStateResponse {
  bool active = 1;
  uint64 run_id = 2;
  string plan_id = 3;
  MissionMode mode = 4;
  MissionRunState state = 5;
  uint64 revision = 6;            // เพิ่มทุก transition — UI ตรวจว่าเห็น state ล่าสุด
  repeated uint32 participants = 7;
  int32 current_index = 8;        // GROUPED / SWARM_LEADER
  map<uint32, int32> sep_index = 9; // SEPARATE
  repeated uint32 arrived = 10;
  repeated MissionWait waits = 11;
  string last_transition = 12;
  string terminal_reason = 13;
  bool authority_active = 14;     // true only while Go Core owns waypoint GOTO for this run
  MissionPlan plan = 15;          // frozen plan snapshot for restartable cockpit rebuild
  repeated MissionParticipantRejection participant_rejections = 16;

  // V3-S10 durable restart evidence. recovery_required is command-inert:
  // active/authority_active MUST both be false until explicit operator clear.
  bool recovery_required = 17;
  MissionRunState recovery_previous_state = 18;
  string recovery_reason = 19;
  uint32 persistence_schema_version = 20;
  uint64 persisted_revision = 21;
  string authority_scope = 22;
  string origin_session_id = 23;
  string core_session_id = 24;
  bool persistence_compatible = 25;
  string persistence_fault = 26;
  string operation_id = 27;
  MissionReturnPolicy resolved_return_policy = 28;
  MissionReturnState return_state = 29;
  repeated uint32 return_participants = 30;
  string return_reason = 31;

  // V3-S09-C current in-run SWARM_LEADER ownership. plan.leader_id and
  // participants remain the immutable original operator plan.
  uint32 current_leader_id = 32;
  repeated uint32 active_participants = 33;
  repeated uint32 excluded_participants = 34;
  string succession_reason = 35;
  uint64 swarm_generation = 36;
  bool succession_pending = 37;
}
